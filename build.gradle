plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
    maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
    maven { name = 'Create'; url = 'https://maven.createmod.net' }
    maven { name = 'Flywheel'; url = 'https://maven.tterrag.com' }
    maven { name = 'Registrate'; url = 'https://maven.ithundxr.dev/snapshots' }
    maven { name = 'Parchment'; url = 'https://maven.parchmentmc.org' }
    maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { name = 'BlameJared'; url = 'https://maven.blamejared.com' }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
    exclusiveContent {
        forRepository {
            maven { name = 'RyanHCode'; url = 'https://maven.ryanhcode.dev/releases' }
        }
        filter {
            includeGroup('dev.ryanhcode.sable')
            includeGroup('dev.ryanhcode.sable-companion')
        }
    }
    exclusiveContent {
        forRepository {
            maven { name = 'ModrinthMaven'; url = 'https://api.modrinth.com/maven' }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

// Mods needed only inside the development runs. They are not exported to
// consumers of this project and are not listed as hard dependencies.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}") { transitive = false }
    implementation("com.tterrag.registrate:Registrate:${registrate_version}") { transitive = false }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    localRuntime("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")

    // Sable is a hard dependency: the trucks are block entities that Sable ticks on a sub-level,
    // so nothing in the rail package can even load without it.
    compileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}") { transitive = false }
    // Pose3d and the sub-level access interfaces live in Companion, which Sable brings at runtime.
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    // Companion has no platform artifact of its own: the Sable jar brings it at runtime.
    localRuntime("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}") { transitive = false }
    localRuntime("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'com.simibubi.create'
        exclude group: 'dev.ryanhcode.sable-companion'
    }

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

neoForge {
    version = neo_version
    validateAccessTransformers = true

    parchment {
        minecraftVersion = parchment_minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    runs {
        client {
            client()
            ideName = 'Create: Sable 'n Rails: Client'
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            ideName = 'Create: Sable 'n Rails: Server'
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
        // Scripted physics session: builds a vehicle, drives it and prints measurements.
        // `./gradlew runSelfTest` runs the whole set and stops the server by itself.
        selfTest {
            server()
            ideName = 'Create: Sable 'n Rails: Physics Self-Test'
            gameDirectory = project.file('runs/selftest')
            programArgument '--nogui'
            systemProperty 'cts.selftest', 'true'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

modLoader = "javafml"
loaderVersion = "[4,)"
license = "Apache-2.0"
issueTrackerURL = "https://github.com/GoShadowS/create-trains-sable/issues"

[[mods]]
modId = "createtrainssable"
version = "0.1.0"
displayName = "Create Trains Sable"
authors = "GoShadowS"
description = '''
Physics bogeys that put a Sable vehicle on Create rails: adhesion-limited
traction and braking, real curves, derailment when the flange limit is
exceeded, and automatic couplers between vehicles.
'''

[[mixins]]
config = "createtrainssable.mixins.json"

[[dependencies.createtrainssable]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.228,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createtrainssable]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createtrainssable]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "AFTER"
side = "BOTH"

# Required since the physics bogeys: a bogey is a block entity that Sable ticks on a
# sub-level, so the classes cannot even load without it.
[[dependencies.createtrainssable]]
modId = "sable"
type = "required"
versionRange = "[2.0.0,3.0.0)"
ordering = "AFTER"
side = "BOTH"

# Bundled as jar-in-jar; Sable itself also embeds this library and overrides its service.
[[dependencies.createtrainssable]]
modId = "sablecompanion"
type = "optional"
versionRange = "[1.6.0,1.7.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.createtrainssable]]
modId = "aeronautics"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.createtrainssable]]
modId = "simulated"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.createtrainssable]]
modId = "offroad"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

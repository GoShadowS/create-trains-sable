name: build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: gradlew build
        id: gradle
        run: |
          set +e
          ./gradlew build --no-daemon --console=plain > /tmp/gradle.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -60 /tmp/gradle.log
          echo "ARTIFACT:"
          ls -l build/libs || true
          if [ "$status" -ne 0 ]; then
            # Annotations are the only failure channel that stays readable outside the runner.
            grep -E "error:" /tmp/gradle.log | head -10 | while IFS= read -r line; do
              echo "::error title=javac::${line}"
            done
            {
              printf '### build failed for `%s`\n\n```\n' "${GITHUB_SHA:0:8}"
              grep -E "error:|FAILURE|What went wrong|^> |warning: \[" /tmp/gradle.log | head -80
              printf '```\n'
            } > /tmp/report.md
            gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
              -f body="$(cat /tmp/report.md)" > /dev/null || true
            exit 1
          fi

          {
            printf '### build, commit `%s`\n\n' "${GITHUB_SHA:0:8}"
            printf '`./gradlew build` succeeded.\n\n'
            python3 tools/test_summary.py
            printf '\n- jar: '
            ls -l build/libs/*.jar 2>/dev/null | awk '{print $9 " (" int($5/1024) " KB)"}' | paste -sd ", " -
            printf '\n'
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/report.md)" > /dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
      - name: upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/*.jar
          if-no-files-found: warn

  boot:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: dedicated server must reach "Done ("
        run: |
          mkdir -p runs/server
          echo "eula=true" > runs/server/eula.txt
          {
            echo "online-mode=false"
            echo "level-type=minecraft\:flat"
            echo "spawn-protection=0"
            echo "max-tick-time=-1"
          } > runs/server/server.properties
          rm -f /tmp/server.log
          setsid ./gradlew runServer --no-daemon --console=plain > /tmp/server.log 2>&1 &
          pid=$!
          ok=0
          fatal=0
          for i in $(seq 1 300); do
            if grep -q "Done (" /tmp/server.log; then ok=1; break; fi
            if grep -qE "Mixin apply failed|Failed to create mod|A fatal error has been detected|Exception in thread \"main\"|Failed to start the minecraft server" /tmp/server.log; then fatal=1; break; fi
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 4
          done
          kill -TERM -$pid 2>/dev/null || true
          sleep 6
          kill -KILL -$pid 2>/dev/null || true
          pkill -f GradleWrapperMain 2>/dev/null || true
          pkill -f "net.neoforged" 2>/dev/null || true
          echo "--- log tail ---"
          tail -120 /tmp/server.log
          marker="Create Trains Sable: rail contact ready"
          loaded=0
          grep -qF "$marker" /tmp/server.log && loaded=1
          {
            printf '### dedicated server, commit `%s`\n\n' "${GITHUB_SHA:0:8}"
            if [ "$ok" = "1" ]; then
              printf 'server reached `Done (`.\n\n'
            else
              printf 'server did **not** reach `Done (` (fatal=%s).\n\n' "$fatal"
            fi
            if [ "$loaded" = "1" ]; then
              printf 'the mod initialised: `%s`\n\n' "$marker"
            else
              printf 'the mod did **not** initialise (no `%s` in the log).\n\n' "$marker"
            fi
            printf '```\n'
            if [ "$ok" = "1" ] && [ "$loaded" = "1" ]; then
              grep -E "Done \(|rail contact ready|Mixin apply failed|ERROR" /tmp/server.log | head -20
            else
              tail -160 /tmp/server.log
            fi
            printf '```\n'
          } > /tmp/report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/report.md)" > /dev/null || true
          if [ "$ok" != "1" ] || [ "$loaded" != "1" ]; then exit 1; fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Scripted physics: builds a vehicle on a synthetic rail, drives it and prints measurements.
  # This is the gate that "the server started" is not: it fails unless every scenario reports PASS.
  selftest:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: ./gradlew runSelfTest
        run: |
          mkdir -p runs/selftest
          echo "eula=true" > runs/selftest/eula.txt
          {
            echo "online-mode=false"
            echo "level-type=minecraft\:flat"
            echo "spawn-protection=0"
            echo "max-tick-time=-1"
          } > runs/selftest/server.properties
          set +e
          timeout 1500 ./gradlew runSelfTest --no-daemon --console=plain > /tmp/selftest.log 2>&1
          status=$?
          set -e
          echo "gradle status=$status"
          echo "--- self-test lines ---"
          grep -E "CTS SELFTEST|physics self-test armed" /tmp/selftest.log || true
          summary=$(grep -E "CTS SELFTEST SUMMARY" /tmp/selftest.log | tail -1 || true)
          {
            printf '### physics self-test, commit `%s`\n\n' "${GITHUB_SHA:0:8}"
            if [ -n "$summary" ]; then
              printf '`%s`\n\n' "$summary"
            else
              printf 'the harness never printed a summary (gradle status %s).\n\n' "$status"
            fi
            printf '```\n'
            grep -E "CTS SELFTEST" /tmp/selftest.log || tail -80 /tmp/selftest.log
            printf '```\n'
          } > /tmp/report.md
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat /tmp/report.md)" > /dev/null || true
          if [ -z "$summary" ]; then exit 1; fi
          echo "$summary" | grep -q "failed=0" || exit 1
        env:
          GH_TOKEN: ${{ github.token }}

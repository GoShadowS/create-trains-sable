issueTrackerURL = "https://github.com/GoShadowS/create-trains-sable/issues"

[[mods]]
modId = "createtrainssable"
version = "0.1.0-alpha"
displayName = "Create Trains Sable"
authors = "GoShadowS"
# Original project and author. Required notice: see NOTICE and the "Original project" section of
# README.md. Forks must keep this line, the NOTICE file and that README section (Apache-2.0 4(d)).
description = '''
Physical rail vehicles for Create and Sable. Put traction and rolling trucks
under a build, assemble it into a sub-level, and every axle holds itself on
Create rails with real wheel/rail contact: adhesion-limited traction and
braking, curves that can throw the vehicle off, and spring couplings between
vehicles.
'''

[[dependencies.createtrainssable]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.228,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createtrainssable]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.createtrainssable]]
modId = "create"
type = "required"
versionRange = "[6.0.10,6.1.0)"
ordering = "AFTER"
side = "BOTH"

# Required: a truck is a block entity that Sable ticks on a sub-level, so the rail
# package cannot even load without it.
[[dependencies.createtrainssable]]
modId = "sable"
type = "required"
versionRange = "[2.0.0,3.0.0)"
ordering = "AFTER"
side = "BOTH"


[[dependencies.createtrainssable]]
modId = "simulated"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.createtrainssable]]
